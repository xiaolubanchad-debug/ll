---
- name: Require an accepted Ubuntu LTS version
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version in ['24.04', '26.04']
    fail_msg: UNSUPPORTED_OS
- name: Require the pinned x86_64 toolchain architecture
  ansible.builtin.assert:
    that: ansible_facts.architecture == 'x86_64'
    fail_msg: UNSUPPORTED_ARCH
